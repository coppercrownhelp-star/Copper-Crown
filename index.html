<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown & Copper | Electrical Craftsmanship</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --copper: #b87333;
            --text-light: #f8fafc;
            --text-muted: #a1a1aa;
            --border-gold: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(184, 115, 51, 0.1) 0%, transparent 70%);
        }

        /* Business Card Container */
        .card-container {
            width: 100%;
            max-width: 500px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8),
                        0 0 30px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(15px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        /* Logo Branding */
        .logo-wrapper {
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .logo-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.03);
        }

        /* Typography */
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 50%, var(--gold-primary) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .tagline {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: var(--gold-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* Contact Details Grid */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .info-item i {
            color: var(--gold-primary);
            font-size: 1rem;
        }

        .info-item:hover {
            color: var(--gold-light);
        }

        /* Links Section */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-light);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            border: 1px solid var(--border-gold);
            transition: all 0.3s ease;
        }

        .link-btn i {
            font-size: 1.1rem;
            color: var(--gold-primary);
            transition: color 0.3s ease;
        }

        .link-btn:hover {
            background: linear-gradient(135deg, var(--gold-primary), var(--copper));
            color: #000;
            font-weight: 600;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
            border-color: transparent;
        }

        .link-btn:hover i {
            color: #000;
        }

        /* Footer */
        .footer-text {
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Logo -->
        <div class="logo-wrapper">
            <img class="logo-img" src="Black and White Minimalist Interior Design Business Card (3).png" alt="Crown & Copper Logo">
        </div>
        
        <!-- Header Text -->
        <h1 class="brand-title">Crown & Copper</h1>
        <p class="tagline">The Royal Standard of Electrical Craftsmanship</p>

        <!-- Direct Contact Details from Card -->
        <div class="contact-info">
            <a href="tel:03294942684" class="info-item">
                <i class="fa-solid fa-phone"></i>
                <span>0329-4942684</span>
            </a>
            <a href="mailto:coppercrown.pk@gmail.com" class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <span>coppercrown.pk@gmail.com</span>
            </a>
        </div>
        
        <!-- Social & Quick Links -->
        <div class="links-wrapper">
            <a href="https://wa.me/923294942684" target="_blank" class="link-btn">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp Contact
            </a>
            <a href="https://www.instagram.com/copper._.crown?igsh=MXpnczZ1MzdkMWcw" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="https://www.facebook.com/share/1DC4Jkjm2F/" target="_blank" class="link-btn">
                <i class="fa-brands fa-facebook-f"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@copper._.crown?_r=1&_t=ZS-97LBs5ADTzs" target="_blank" class="link-btn">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
            <a href="https://yourwebsite.com" target="_blank" class="link-btn">
                <i class="fa-solid fa-globe"></i> Visit Website
            </a>
        </div>

        <p class="footer-text">&copy; Crown & Copper. All Rights Reserved.</p>
    </div>

</body>
</html>
